# 사전등록 — 무엇을 언제 어떤 설정으로 재기로 했는지를 **미리** 못 박는다.
#
# 이 파일이 정본을 정한다. 여기에 없는 실행은 아무리 좋은 백분위가 나와도 보드에 오르지 않는다
# (`src/signal_desk/prereg.py` · docs/prd-harness-preregistration.md).
#
# 규칙 셋:
#  1. 값을 바꾸면 **커밋**된다. DB에 두면 조용히 고칠 수 있어서 '사전'이 성립하지 않는다.
#  2. 요건 충족일에 **단 한 번** 판정하고 동면한다. 재판정은 새 id를 등록해야 한다.
#  3. Šidák n = **파일 전체의 정본 look 총수**(현재 3 → 문턱 98.30%). family를 나눠도 n은 줄지
#     않는다 — 파일을 쪼개 n을 낮추는 것이 곧 사후 완화다. **lock 상태와도 무관하게 고정**이다
#     (interim이 확정되면 n이 줄어 final 문턱이 저절로 내려가는 완화를 막는다).
#  4. **결과를 본 가설은 `requirement.from_date`로 OOS 구간을 걸어야** 정본이 된다. 탐색으로
#     숫자를 본 조합을 그 뒤에 등록하면 사후등록이고, 사전등록의 의미가 사라진다.
#
# 왜 look이 둘인가: final 요건(PIT 150거래일)은 2027-02경에 도달한다. 그때까지 눈을 감을 수 없어
# interim(60거래일, 2026-10경)을 함께 등록했다. 두 번 보는 대가로 문턱을 95 → 97.47로 올린다.

[base]
family       = "pit-8factor-rank3-hold5"
score_source = "pit"                    # 가격 하네스는 technical·reversion·momentum 셋만 계산한다
market       = "kr"                     # 횡단면 순위는 한 시장 안에서만

# signalcfg.FIELDS(17) + selection_mode. 2026-08-06 engine.SignalConfig 실측과 일치.
# `test_redteam.test_preregistered_config_covers_every_engine_field` 가 누락을 막는다 —
# 새 점수 필드가 등록에서 빠지면 그 파라미터는 검증된 적 없이 판정에 섞인다.
# weight_qualitative 는 FIELDS 에 없다(KB 정성은 veto/shadow) → 사전등록·해시 대상이 아니다.
[base.config]
weight_technical      = 0.0     # H1(2026-08-03) ablation으로 0
weight_fundamental    = 0.30
weight_valuation      = 0.15
weight_reversion      = 0.20
weight_flow           = 0.20
# 2026-08-06 정정: "커버리지 0%"는 낡은 서술이었다. 실측 라이브 발동 198/200(99%)이고
# 하네스 price6 재구성 커버리지도 98.3%다. 0이었던 것은 **PIT 스냅샷 기록**이며
# 2026-08-06 스냅샷부터 채워진다(그 앞 11일은 0) — 즉 IC 20일 시계가 이제 시작됐다.
weight_quality        = 0.15
weight_momentum       = 0.30    # 최대 가중. 코드 주석상 "트래커 라이브 IC로 확정" 예정 = 잠정
# 2026-08-06 실측: 라이브 발동 154/200(77%). PIT 스냅샷은 08-04부터 기록(그 앞 10일은 0)이라
# IC 날짜가 2일뿐이다 — 20일 요건까지 대기. 하네스 price6은 시계열 이력이 없어 원리적으로 불가.
weight_short          = 0.15
strong_buy_threshold  = 2.0
buy_threshold         = 1.2
sell_threshold        = -1.2
strong_sell_threshold = -2.0
regime_adaptive       = 1.0
rank_top_pct          = 3.0
rank_min_score        = 1.2
# X2(2026-08-06) 재정규화 편향 게이트. 매수권에 요구하는 데이터 커버리지 하한.
# 이 값이 없으면 팩터가 빠진 종목이 남은 팩터로 재정규화돼 극단 점수를 받는다(실측 |점수| 평균
# 1.070 vs 0.303). 실측 분포로 0.80을 골랐다 — 0.75는 상위6 중 0자리, 0.90은 6자리(매수 0).
# **미검증 변경이다**: 판별력이 `판정 불가`인 동안 넣은 게이트이므로 이 판정의 대상은 이 게이트를
# 포함한 규칙이다. 값을 바꾸면 새 look을 등록해야 한다(같은 id로 재판정하지 않는다).
min_data_coverage     = 0.80
trend_gate            = 1.0     # 하락추세 게이트 적용(현행). D4 family가 0.0으로 대조한다
selection_mode        = "rank"

[base.harness]
hold     = 5
cost_pct = 0.25
trials   = 200      # 격자 0.5%p. 40이면 문턱 97.47%를 표현조차 못 한다
exposure = false    # 하네스는 익스포저 100%. 라이브(약세 국면 40%)와 다르다 — 아래 참고
top_pct  = 3.0

[[looks]]
id            = "pit-8factor-rank3-hold5-interim"
role          = "interim"
registered_at = "2026-08-05"
hypothesis    = """
PIT 8팩터 종합점수 상위 3%(6자리)·5일 보유 랭킹은 라벨 치환 대조군보다 상위에 있다.

이 관측은 중간 판독이며 **채택 근거가 아니다** — 통과해도 final까지 가중치를 바꾸지 않는다.
실패해도 기각하지 않는다(표본 부족과 판별력 부재를 이 표본으로는 구분할 수 없다).

세 가지를 미리 적어 둔다:
- hold=5는 실측 채점 지평(20거래일)과 다르다. hold=20은 실효 30기간에 600거래일(약 2.4년)이
  필요해 현실적이지 않아 5로 등록한다. 즉 이 판정은 5일 보유 랭킹의 판별력이다.
- 하네스는 익스포저 100%로 재고 라이브는 국면에 따라 줄인다(관측일 기준 40%). 익스포저는
  "점수에 미래 정보가 있는가"라는 귀무가설과 무관한 사이징 레이어이므로 섞지 않는다 —
  섞으면 국면 룰의 오류가 판별력 판정에 스며들어 무엇이 실패했는지 못 가른다.
- Šidák n=2(문턱 97.47%)는 독립 다중검정이 아니라 같은 가설의 2회 순차 관측에 대한 보수적
  대용이다. 두 관측은 양의 상관이라 필요한 것보다 엄격한 쪽으로 틀린다 — 그 방향은 받아들인다.
"""
[looks.requirement]
min_effective_periods = 12    # 실효 = periods − 매수 0건 기간(최악 위상 기준)
min_pit_dates         = 60    # 2026-08-05 기준 19거래일 → +41거래일 (약 2026-10)

[looks.decision]
if_pass = "중간 판독 통과. 채택 보류 — final 요건까지 대기. 가중치 변경 게이트는 열지 않는다."
if_fail = "중간 판독 실패. 그래도 final까지 대기한다(표본 부족과 판별력 부재를 구분 못 하므로)."

[[looks]]
id            = "pit-8factor-rank3-hold5-final"
role          = "final"
registered_at = "2026-08-05"
hypothesis    = """
같은 가설의 확정 관측. **이 결과만 정본이다.**
요건은 기존 `harness.min_periods`(30)를 그대로 존중한다 — 임의로 낮추는 것이 곧 고르기다.
"""
[looks.requirement]
min_effective_periods = 30
min_pit_dates         = 150   # 2026-08-05 기준 19거래일 → +131거래일 (약 2027-02)

[looks.decision]
if_pass = "종합점수를 순위 근거로 확정. 가중치 변경 게이트(N2)를 연다."
if_fail = "종합점수를 순위 근거로 쓰지 않는다. rank 창·게이트 재설계로 이동."


# ============================================================================
# family 2 — D4: 하락추세 게이트를 뺀 랭킹
# ============================================================================
#
# **이 family는 결과를 이미 본 가설이다.** 2026-08-06 진단 실행에서 게이트를 끄면 백분위가
# 71.5 → 92.5로 올랐다(대신 위상편차 73.2 → 109.4pp). 그 숫자를 근거로 여기 등록하면
# 사후등록이므로, `from_date` 로 **등록일 이후 거래일만** 쓰게 못 박는다 — 그 구간은 아직
# 아무도 보지 못했다.
#
# 왜 별개 family인가: `trend_gate` 가 다르므로 같은 family의 순차 관측이 아니다(설정이 다르면
# Šidák 가정이 깨진다 — `prereg.load` 가 이걸 거부한다). 대신 **파일 전체 n에 포함**되어
# 문턱이 97.47 → 98.30%로 모두 올라간다. 가설을 하나 더 보는 대가다.
#
# 무엇을 재지 않는가: 이 등록은 게이트를 **끄는** 쪽만 본다. 레포 규칙이 권하는
# "자격이 아니라 크기로"(익스포저 하한 > 0)는 하네스에 종목별 사이징이 없어 아직 구현되지
# 않았다 — 구현하면 그때 세 번째 family로 등록한다(그리고 n은 또 올라간다).

[[families]]
family       = "pit-6factor-rank3-hold5-no-trend-gate"
score_source = "price6"
market       = "kr"
# 라이브와 **의도적으로** 다른 키. 이것만 면제되고 나머지 16개는 엔진과 대조된다 —
# 검사를 통째로 끄면 "라이브에서 한 가지만 바꾼 것"이라는 전제가 조용히 거짓이 된다.
diff_from_live = ["trend_gate"]

[families.config]
weight_technical      = 0.0
weight_fundamental    = 0.30
weight_valuation      = 0.15
weight_reversion      = 0.20
weight_flow           = 0.20
weight_quality        = 0.15
weight_momentum       = 0.30
weight_short          = 0.15
strong_buy_threshold  = 2.0
buy_threshold         = 1.2
sell_threshold        = -1.2
strong_sell_threshold = -2.0
regime_adaptive       = 1.0
rank_top_pct          = 3.0
rank_min_score        = 1.2
min_data_coverage     = 0.80
trend_gate            = 0.0     # ← family 1과 여기만 다르다
selection_mode        = "rank"

[families.harness]
hold     = 5
cost_pct = 0.25
trials   = 200
exposure = false
top_pct  = 3.0

[[families.looks]]
id            = "d4-no-trend-gate-oos"
role          = "final"
registered_at = "2026-08-06"
hypothesis    = """
하락추세 게이트(종가<MA20<MA60 역배열에서 매수 차단)를 **빼면** 6팩터 상위 3%·5일 보유 랭킹의
판별력이 라벨 치환 대조군 대비 문턱을 넘는다.

이 등록의 성격을 분명히 적어 둔다:

- **결과를 이미 본 가설이다.** 2026-08-06 진단 실행(전 구간 2024-04-01~2026-08-04)에서
  게이트 ON 백분위 71.5 · OFF 92.5였다. 그래서 `from_date = 2026-08-07` 로 등록일 이후
  거래일만 쓴다. 그 구간은 등록 시점에 존재하지 않았다.
- **절대 수익률은 판단에 쓰지 않는다.** OFF가 +165.5%로 ON(+98.8%)보다 높았지만, 그건
  게이트를 뺐으니 더 많이 산 결과이기도 하다. 판단은 백분위뿐이다.
- **위상편차가 커지는 것은 예상된 대가다.** ON 73.2pp → OFF 109.4pp. 통과해도 이건
  "게이트가 쓸모없다"가 아니라 "이 지평·이 창에서 순위 정보가 게이트 손실보다 크다"는 뜻이다.
- 실패하면 게이트를 유지한다. 그 경우 D4의 남은 선택지는 **자격이 아니라 크기로**
  (익스포저 하한 > 0) 이고, 그건 하네스에 종목별 사이징을 넣은 뒤 별도 family로 등록한다.
- Šidák n=3(문턱 98.30%). family를 나눠도 n은 줄지 않는다.
"""

[families.looks.requirement]
min_effective_periods = 30      # 실효 = periods − 매수 0건 기간(최악 위상 기준)
min_pit_dates         = 150     # OOS 구간 안에서 센다 — 약 2027-03
from_date             = "2026-08-07"   # 등록 다음 거래일부터. 이 앞은 이미 본 구간이다

[families.looks.decision]
if_pass = "하락추세 게이트를 매수 자격에서 제외한다(수동 변경 + unproven 해제). 게이트 문구는 표시용으로 남긴다."
if_fail = "게이트를 유지한다. 다음 후보는 '자격이 아니라 크기로' — 종목별 사이징을 하네스에 넣고 새 family로 등록."


# ============================================================================
# 실측 정확도 look — 하네스 백분위가 아니라 **PIT 실측**을 미리 못 박는다
# ============================================================================
#
# 왜 필요한가(2026-08-17): 헤드라인 실측 지평이 20거래일인데 **그 지평의 매수 표본이 0**이다
# (매수권이 최근에야 생겨 h20 성숙 구간에 매수가 없었다 — 고장이 아니라 순서다). 반면 실제
# 매매는 단기다 — 봇 채점 3일 · 하네스 보유 5일. 그리고 h5에는 이미 매수 36건 · 리프트
# +18.5%p가 쌓여 있다.
#
# **그 숫자를 근거로 쓸 수 없다.** 지평 3개(5·20·60) 중 좋아 보이는 하나를 고른 것이고,
# 판별력이 전혀 없어도 3번 보면 하나가 통과할 확률이 약 14%다. 그래서 아직 보지 않은 구간에
# `from_date` 로 걸어 1회 확정한다.
#
# n에 포함된다: 이 look 하나로 파일 전체 문턱이 98.30 → **98.73%** 로 올라간다(z 2.388 →
# 2.491). 종류가 다르다고 따로 세면 그게 곧 사후 완화다.
#
# 이것은 **헤드라인이 아니다.** 첫 화면 판정은 하네스 정본 하나뿐이다 — 판정 경로가 둘이면
# 갈릴 때 관대한 쪽이 읽힌다(DSR 0.979 vs 백분위 71.5에서 이미 겪었다).

[[accuracy_looks]]
id            = "buy-lift-h5-oos"
role          = "final"
registered_at = "2026-08-17"
horizon       = 5          # 봇 채점(3일)·하네스 보유(5일)와 같은 단기 쪽
market        = "kr"
hypothesis    = """
매수·강력매수 시그널의 **5거래일 실현 적중률**이 같은 기간 전 종목 기준선을 리프트 3%p 초과한다.
판정은 Šidák 보정 z를 적용한 리프트 **하한**으로 한다 — 점추정이 문턱을 넘는 것으로는 부족하다.

통계 규약을 미리 적어 둔다(나중에 고르면 그게 고르기다):

- **표본 단위는 (종목·날짜) 판단이지만 그것을 독립으로 세지 않는다.** 같은 날 여러 종목을 사면
  시장 드리프트를 공유하고, h5 수익은 창이 4일씩 겹친다. 둘 다 소박한 이항 SE를 **과소평가**
  쪽으로 틀리게 한다. 그래서 날짜를 겹치지 않는 5일 블록으로 묶어 블록 안에서 평균 내고
  블록 간 분산으로 SE를 낸다(`accuracy.block_lift_verdict`).
- **기준선은 같은 창·같은 모집단의 상승 비율**이다(HOLD 포함 전 표본). 지평·기간·모집단이
  하나라도 다르면 리프트는 거짓이다.
- 기준선 자체의 표본오차도 SE에 더한다. 빼면 관대한 쪽으로 틀린다.
- **요건 미달 동안 이 숫자를 화면 헤드라인에 쓰지 않는다.** 매일 보이면 매일 보게 되고
  그게 곧 다중검정이다. 관리자 검증 탭에서 진척(n/N)만 본다.

무엇을 재지 않는가: 이건 **적중률**이지 수익률이 아니다. 통과해도 "이 지평에서 매수 판단이
무작위보다 자주 맞았다"는 뜻이고, 비용·슬리피지·사이징을 넣은 성과는 별개다(그건 하네스가 잰다).
"""

[accuracy_looks.requirement]
from_date      = "2026-08-18"   # 등록 다음 날. 이 앞은 이미 본 구간이다
min_buy_sample = 60             # 실측 h5 매수 발생률 약 1.3건/거래일 → 약 45거래일
min_dates      = 60             # 12개 독립 블록. 블록이 적으면 분산을 못 잰다
min_lift_pp    = 3.0            # `accuracy.lift_min_pp` 와 같은 값 — 두 곳이 갈라지면 안 된다

[accuracy_looks.decision]
if_pass = "5거래일 지평에서 매수 판단의 판별력을 인정한다. 단타 지평을 실측 헤드라인 후보로 승격하는 논의를 연다(가중치 변경 게이트는 열지 않는다 — 그건 하네스 정본의 몫이다)."
if_fail = "h5 매수 판별력을 인정하지 않는다. h5의 +18.5%p는 지평 고르기였다는 뜻이므로, 단기 지평 주장을 접고 하네스 정본(hold=5 백분위)만 본다."


# ============================================================================
# 횡단면 IC look — 검정 통계량을 바꾼다(2026-08-17)
# ============================================================================
#
# **왜 바꾸나.** 기존 정본은 "6종목 포트폴리오의 누적수익이 라벨 치환 대조군보다 위인가"를
# 본다. 그 통계량으로 무엇을 잡을 수 있는지 실측했다(대조군 300회):
#
#     기간당 초과수익  +0.253% · 표준편차 4.19%p  →  t = 0.89 (219기간)
#     필요 표본: 연 20%p 초과수익을 잡으려면 24년 · 연 5%p면 389년
#
# 즉 `min_periods` 를 30에서 어떤 값으로 바꿔도 현실적인 우위는 안 잡힌다. **문턱 문제가
# 아니라 통계량 문제**였다 — 200종목 중 6개만 보고 나머지 97%의 정보를 버리고 있었다.
#
# 같은 데이터를 횡단면 IC로 재면:
#
#     IC 평균 +0.0200 · 날짜별 표준편차 0.1856  →  t = 1.56 (독립 210관측)
#
# 1.75배 효율(= 같은 t에 3배 적은 표본). 그래도 유의하지 않다 — 통계량을 바꿔도 "지금은
# 모른다"는 결론은 안 바뀐다. 바뀌는 것은 **얼마나 기다려야 알 수 있는가**뿐이다.
#
# **노이즈의 성질도 재 두었다.** IC 날짜별 표준편차 0.186 중 200종목 유한표본에서 오는 몫은
# 1/√199 = 0.071 뿐이고, 나머지 0.172 는 국면에 따라 팩터가 먹기도 안 먹기도 하는 **실제
# 변동**이다. 종목을 더 넣어도(미국 500 추가) 이 부분은 안 줄어든다 —
# "표본을 늘리면 된다"가 통하지 않는 이유를 여기 적어 둔다.
#
# 기존 하네스 look 3개는 **지우지 않는다.** 지우면 Šidák n이 줄어 다른 가설의 문턱이
# 내려가는 사후 완화다. 그 look들이 사실상 판정 불가라는 사실은 위 실측이 말해 준다.
#
# n = 5 → 백분위 문턱 98.98% · 판정 z 2.569.

[[ic_looks]]
id            = "kr-score-ic-h5-oos"
role          = "final"
registered_at = "2026-08-17"
horizon       = 5          # 봇 채점(3일)·하네스 보유(5일)와 같은 단기 쪽
market        = "kr"
hypothesis    = """
종합점수의 **날짜별 횡단면 IC**(200종목 순위 vs 5거래일 실현수익) 평균이 0보다 크다.

미리 못 박는 것:

- **귀무가설은 IC = 0 이고, `mie` 는 판정 문턱이 아니라 표본 크기를 정하는 값이다.**
  `mie` 를 문턱으로 쓰면 "0.08 미만은 없는 것"이 되어 작지만 진짜인 우위를 기각한다.
  판정은 언제나 "하한이 0보다 큰가"다.
- **독립 관측은 `날짜 수 / 5` 다.** h5 수익을 매일 재면 창이 4일씩 겹친다 — 중첩 창의 t는
  부풀려진다는 규칙을 IC에도 그대로 적용한다.
- 요건 63 독립관측(= 313거래일 ≈ 15개월)은 `mie = 0.08` 에서 검정력 80%가 나오는 크기다.
  실측 표준편차 0.1856 · 판정 z 2.569로 역산했다. **더 작은 우위를 잡으려면 더 오래
  걸린다** — IC 0.05면 36개월, 0.02면 19년이다. 그 교환을 알고 0.08을 골랐다.
- **요건 미달 동안 IC 수치를 화면에 내지 않는다.** 매주 보이면 매주 보게 되고 그게 곧
  다중검정이다. 주간 트랙(`ic_progress`)은 **구속력 없는 진척**으로만 낸다.
- 조기 기각(futility): 남은 관측이 전부 와도 문턱을 넘으려면 앞으로 평균 IC가 `mie` 의
  2배를 넘어야 하는 상태가 되면 기다리지 않고 기각한다. 실측 시뮬레이션에서 우위가 전혀
  없으면 **200거래일(약 9.5개월)** 에 걸린다 — 15개월을 다 기다릴 필요가 없다.

무엇을 재지 않는가: IC는 **순위를 맞히는 능력**이고 수익이 아니다. 통과해도 비용·슬리피지·
사이징을 넣은 성과는 별개이며, 그건 하네스가 잰다.
"""

[ic_looks.requirement]
from_date       = "2026-08-18"   # 등록 다음 날. 이 앞은 이미 본 구간이다
min_independent = 63             # mie 0.08 · sd 0.1856 · z 2.569 · 검정력 80%
mie             = 0.08           # 최소 관심 우위 — 표본 크기를 정하는 값
futility_factor = 2.0            # 필요 미래 IC가 mie의 이 배수를 넘으면 조기 기각

[ic_looks.decision]
if_pass = "종합점수의 횡단면 판별력을 인정한다. 가중치 변경 게이트(N2)를 여는 근거로 하네스 정본과 함께 쓴다."
if_fail = "종합점수의 횡단면 판별력을 인정하지 않는다. 팩터별 IC 분해를 보고 어느 팩터가 죽었는지부터 확인한다."
