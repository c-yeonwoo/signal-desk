[project]
name = "signal-desk"
version = "0.1.0"
description = "검증된 적중률 기반 주식 매매 타이밍 시그널 플랫폼"
requires-python = ">=3.11,<3.14"  # 3.14 는 pandas/pyarrow C확장 세그폴트 이력(Signal APT 참고) — 2단계에서 pandas 도입 시 주의
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pykrx>=1.0",
    "pypdf>=4.0",              # PDF 텍스트 추출(네이티브 텍스트 PDF)
    "python-multipart>=0.0.9",  # FastAPI 파일 업로드
    "youtube-transcript-api>=1.0",  # 유튜브 자막 전문 수집(KB 소스)
]
# 숏폼 영상 렌더(cairosvg+ffmpeg)는 서버가 아니라 사용자 PC에서 수행 — 서버 의존성 아님.
# 로컬 렌더 준비물: pip install cairosvg + ffmpeg(README/zip 안내).

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# 진짜 시맨틱 임베딩(로컬). 없으면 hashing/OpenAI(OPENAI_API_KEY) 폴백.
embed = ["sentence-transformers>=3.0"]

[project.scripts]
sigdesk = "signal_desk.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 런타임에 읽는 **비 .py 파일**은 여기 선언된 것만 휠에 들어간다. Dockerfile이
# `pip install .`(비편집)을 쓰므로 빠지면 프로덕션에서만 500이 난다 — 로컬은 소스 트리를
# 그대로 보니 전부 통과한다.
#
# **`web/*` 는 하위 디렉토리를 안 잡는다**(2026-08-17). PWA 아이콘을 `web/icons/` 에 두고
# 배포했더니 `/manifest.webmanifest`·`/sw.js` 는 200인데 `/icons/*.png` 만 500이었다 —
# 라우트는 있고 파일이 없었다. 디렉토리를 추가하면 여기도 같이 추가한다
# (`test_packaging.py` 가 src 밑 비 .py 파일을 전부 훑어 대조한다).
[tool.setuptools.package-data]
signal_desk = ["web/*", "web/icons/*", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
